name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Native arm runners; free for public repos.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Both on arm64 images: the Intel macos-13 runner is retired and
          # jobs sent to it sit queued, blocking release and package.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Cross-compile settings
        if: matrix.target == 'x86_64-apple-darwin'
        run: echo "CMAKE_OSX_ARCHITECTURES=x86_64" >> "$GITHUB_ENV"
      # aws-lc-sys, pulled in by russh, is built from C sources.
      - name: Install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Both binaries are built for this target
        run: |
          file target/${{ matrix.target }}/release/bunyipd \
               target/${{ matrix.target }}/release/bunyip-proxy
      # Only a native build can be executed here; the cross one is checked above.
      - name: Both binaries start
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          ./target/${{ matrix.target }}/release/bunyipd --version
          ./target/${{ matrix.target }}/release/bunyip-proxy --version

      - name: Package
        id: package
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          name="bunyip-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/bunyipd \
             target/${{ matrix.target }}/release/bunyip-proxy \
             README.md CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Changelog section for this tag
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          section() {
            awk -v v="$1" '
              /^## \[/ { want = index($0, "[" v "]") == 4; next }
              want
            ' CHANGELOG.md
          }
          section "$version" > notes.md
          # vX.Y.Z-rc1 has no heading of its own: use the release it leads to.
          [ -s notes.md ] || section "${version%%-*}" > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          { echo "## Checksums"; echo; echo '```'; cat dist/*.sha256; echo '```'; } >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: bunyip ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true

  package:
    name: Container package (ghcr.io)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The image ships the binaries the build job already produced on native
      # runners: aws-lc-sys is slow and fragile to cross-compile under QEMU.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Lay out binaries per platform
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}"; target="${pair#*:}"
            mkdir -p "ctx/linux/$arch"
            tar -C "ctx/linux/$arch" --strip-components=1 \
                -xzf "dist/bunyip-${version}-${target}.tar.gz"
          done
          cp Dockerfile ctx/
          find ctx -type f

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
